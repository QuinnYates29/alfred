# Slack app for alfred (P20). api.slack.com/apps → Create New App → From an app manifest → paste this.
# Socket Mode: no public URL needed; alfred connects out to Slack from the Spark.
display_information:
  name: alfred
  description: Your agent platform on the Spark
  background_color: "#03070d"
features:
  bot_user:
    display_name: alfred
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /alfred
      description: status · inbox · add <title> · run coder <task> · or ask anything
      usage_hint: "status | inbox | add Buy milk | run coder <task> | what's running?"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - app_mentions:read
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
