<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Quick add</title>
<style>
  :root { color-scheme: light dark; --bg: #fbfbfc; --fg: #1c1c1e; --muted: #6e6e73; --line: #d8d8dc; --bad: #d93025; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1d; --fg: #f2f2f7; --muted: #98989f; --line: #3a3a3c; --bad: #ff453a; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; }
  input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 20px; padding: 4px 0; }
  .line { margin-top: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line.bad { color: var(--bad); }
</style>
</head>
<body>
<input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Add an item…" autofocus>
<div id="line" class="line">item #label !! @tomorrow · <b>!</b> goal · <b>?</b> ask Alfred · Esc to close</div>
<script>
  const q = document.getElementById('q');
  const line = document.getElementById('line');
  const HINT = line.innerHTML;
  let busy = false;
  const reset = () => { q.value = ''; line.innerHTML = HINT; line.className = 'line'; busy = false; q.disabled = false; q.focus(); };
  window.addEventListener('focus', () => { if (!busy) reset(); });
  q.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter' || busy || !q.value.trim()) return;
    busy = true;
    q.disabled = true;
    line.textContent = q.value.trim().startsWith('?') ? 'Asking…' : 'Adding…';
    let r;
    try { r = await window.alfredNative.quickSubmit(q.value); } catch (err) { r = '⚠ ' + err.message; }
    line.textContent = r;
    line.className = String(r).startsWith('⚠') ? 'line bad' : 'line';
    setTimeout(reset, 1300);
  });
</script>
</body>
</html>
